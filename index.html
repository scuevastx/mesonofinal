<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESONO Sound Creator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #2a2a2a; /* Set background here */
            display: flex; /* Use flexbox on the body */
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center everything vertically */
            overflow: hidden; /* Prevent scrolling issues */
        }
        
        .main-container {
            position: relative;
            width: 600px;
            height: 600px;
            background: url('https://raw.githubusercontent.com/scuevastx/mesonofinal/main/mesono-background.png') center center;
            background-size: cover;
            border-radius: 50%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3),
                        0 0 100px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            animation: containerPulse 3s ease-in-out infinite;
        }

        /* Responsive adjustments for the main container */
        @media (max-width: 768px) {
            .main-container {
                width: 280px;
                height: 280px;
                margin: 0 auto; /* Center horizontally on mobile */
            }
        }

        @media (max-width: 480px) {
            .main-container {
                width: 260px;
                height: 260px;
                margin: 0 auto;
            }
        }
        
        /* The orb is now centered relative to the main-container using `top: 50%` and `transform: translate` */
        .orb {
            position: absolute;
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            cursor: grab;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* This is crucial for centering */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3),
                        0 0 15px rgba(255, 255, 255, 0.4),
                        inset 0 -1px 2px rgba(0, 0, 0, 0.1);
            user-select: none;
            z-index: 100;
            animation: orbPulse 3s ease-in-out infinite;
        }

        /* Other CSS and JS code remain the same... */
        .ring {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 150ms ease-out;
        }

        .logo-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 200px;
            max-height: 90px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6)) brightness(1.2);
            pointer-events: none;
            user-select: none;
            z-index: 50;
        }

        .logo-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 0.2em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5), 0 0 30px rgba(255,255,255,0.6);
            pointer-events: none;
            user-select: none;
            z-index: 50;
            display: none;
        }
        
        @keyframes orbPulse {
            0%, 100% {
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3),
                            0 0 15px rgba(255, 255, 255, 0.4),
                            inset 0 -1px 2px rgba(0, 0, 0, 0.1);
            }
            50% {
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3),
                            0 0 25px rgba(255, 255, 255, 0.6),
                            inset 0 -1px 2px rgba(0, 0, 0, 0.1);
            }
        }
        
        .orb:active {
            cursor: grabbing;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.8);
        }

        .stem {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 150ms ease-out;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .stem.north { top: 60px; left: 50%; }
        .stem.south { bottom: 60px; left: 50%; }
        .stem.east { right: 60px; top: 50%; }
        .stem.west { left: 60px; top: 50%; }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 80px;
        }
        
        .control-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: all 200ms ease;
        }

        .btn-img {
            width: 120px;
            height: auto;
            filter: drop-shadow(0 8px 25px rgba(0, 0, 0, 0.4));
            transition: all 200ms ease;
        }

        .control-btn:hover .btn-img {
            transform: translateY(-2px);
            filter: drop-shadow(0 12px 35px rgba(0, 0, 0, 0.5));
        }

        /* Mobile responsive styles */
        @media (max-width: 768px) {
            .logo-img { max-width: 150px; }
            .logo-text { font-size: 1.5rem; }
            .orb { width: 10px; height: 10px; }
            .stem { width: 8px; height: 8px; }
            .stem.north { top: 30px; }
            .stem.south { bottom: 30px; }
            .stem.east { right: 30px; }
            .stem.west { left: 30px; }
            .controls { margin-top: 20px; }
            .btn-img { width: 70px; }
        }

        @media (max-width: 480px) {
            .main-container { width: 220px; height: 220px; }
            .logo-img { max-width: 120px; }
            .logo-text { font-size: 1.2rem; }
            .orb { width: 8px; height: 8px; }
            .stem { width: 6px; height: 6px; }
            .controls { margin-top: 10px; }
            .btn-img { width: 65px; }
        }

        @media (max-height: 500px) {
            body { padding: 3px; min-height: auto; }
            .main-container { width: 200px; height: 200px; }
            .logo-img { max-width: 100px; }
            .logo-text { font-size: 1rem; }
            .controls { margin-top: 5px; }
            .btn-img { width: 50px; }
        }
    </style>
</head>
<body>
    <div class="main-container" id="container">
        <div id="rings"></div>
        
        <img src="https://raw.githubusercontent.com/scuevastx/mesonofinal/main/mesono-logo.png" 
             alt="MESONO" 
             class="logo-img" 
             id="logoImg"
             onerror="this.style.display='none'; document.getElementById('logoText').style.display='block';">
        
        <div class="logo-text" id="logoText">MESONO</div>
        
        <div class="stem north" id="stem-north"></div>
        <div class="stem south" id="stem-south"></div>
        <div class="stem east" id="stem-east"></div>
        <div class="stem west" id="stem-west"></div>
        
        <div class="orb" id="orb"></div>
    </div>

    <div class="controls">
        <button class="control-btn" id="startBtn" onclick="togglePlay()">
            <img src="https://raw.githubusercontent.com/scuevastx/mesonofinal/main/mesono-start.png" 
                 alt="START" 
                 class="btn-img"
                 id="startImg">
        </button>
    </div>

    <script>
        // Paste the rest of your JavaScript code here, starting from // State management
    </script>
</body>
</html>
